name: API build and deploy

on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/api.yml']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        run: |
          az acr login --name crcbldevcus
          docker build -t crcbldevcus.azurecr.io/cbl-api:${{ github.sha }} ./api
          docker push crcbldevcus.azurecr.io/cbl-api:${{ github.sha }}

      - name: Roll new revision
        run: |
          az containerapp update \
            --name ca-cbl-dev-cus-api \
            --resource-group rg-cbl-dev-cus \
            --image crcbldevcus.azurecr.io/cbl-api:${{ github.sha }}

      - name: Verify
        run: |
          sleep 20
          curl -fsS https://ca-cbl-dev-cus-api.salmonmushroom-8fc4f495.centralus.azurecontainerapps.io/health